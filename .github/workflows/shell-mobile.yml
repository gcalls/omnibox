# =====================================================================================
#  CI/CD riêng cho dự án shell-mobile trong monorepo omnibox (không dùng fastlane).
#
#  Chạy khi push/merge vào main hoặc test VÀ có thay đổi trong shell-mobile/:
#    shell-mobile/src/android/**  → build Android (APK + AAB)
#    shell-mobile/src/ios/**      → build iOS (IPA; ký App Store nếu 1config có bộ ký)
#    shell-mobile/src/** khác, shell-mobile/1config.tar.gpg → build cả hai
#  (chi tiết: shell-mobile/scripts/ci-detect-changes.sh)
#
#  Tên file: {branch}-{version}.{apk|ipa}. File được đăng lên gist chung "omnibox builds".
#  Phiên bản = "version" trong shell-mobile/src/package.json; số build iOS = github.run_number;
#  versionCode Android = major*10000000 + minor*100000 + patch*1000 + run_number % 1000 (minor, patch < 100) –
#  app giải mã ngược để biết bản mới đổi major/minor (bắt buộc cập nhật) hay chỉ patch (src/services/appUpdate.js).
#  Chỉ build nền tảng có code thay đổi (src/android, src/ios) hoặc code dùng chung (src/ còn lại, bundle 1config).
#  Cấu hình: main → `1config/cp.sh production`, test/khác → `1config/cp.sh internal`.
#  Phát hành (Marketplace actions + script API, đọc credential trực tiếp từ 1config đã giải mã):
#    dev    chỉ build + đăng gist (APK, IPA App Store, IPA Ad Hoc + link cài itms-services) – không lên store
#    test   Android → Google Play PLAY_TRACK = internal, alpha (closed), beta (open) + Internal App Sharing (link trong Summary)
#           iOS     → TestFlight: tester nội bộ nhận ngay; nhóm tester ngoài TESTFLIGHT_EXTERNAL_GROUP (kèm link công khai)
#                     sau Beta App Review; Ad Hoc (iPhone đã đăng ký UDID) trên gist như dev
#    main   Android → Google Play production (phát hành đại trà sau khi Google duyệt)
#           iOS     → TestFlight + nộp App Store Review (bỏ qua kèm cảnh báo nếu phiên bản khác đang chờ duyệt)
#    shell-mobile/store.sha256 thay đổi (nội dung 1config/store trong bundle mã hoá) → main: đồng bộ trang
#           store (scripts/store-sync-android.sh, scripts/store_sync_ios.py) mà không build lại.
#  Không dùng Firebase. Google Play cần 1config/android/play-service-account.json; thiếu file thì Android chỉ
#  build + đăng gist.
#  Google Play: app chưa phát hành lần nào thì release chỉ được là draft (scripts/play-release-status.sh
#  tự nhận biết) – bản đầu tiên bấm phát hành trên Play Console, từ đó CI phát hành tự động.
#
#  Secrets (Settings → Secrets and variables → Actions → Repository secrets):
#    ONECONFIG_GPG_PASSPHRASE  passphrase giải mã shell-mobile/1config.tar.gpg
#    GIST_TOKEN                PAT có quyền ghi gist (classic: scope "gist")
#
#  Dự án khác trong omnibox: tạo workflow riêng với `paths: ['<thư-mục>/**']` và dùng lại
#  .github/scripts/publish-to-gist.sh.
# =====================================================================================
name: shell-mobile

on:
  push:
    branches: [main, test, dev]
    paths:
      - "shell-mobile/**"
  workflow_dispatch:
    inputs:
      platform:
        description: "Nền tảng cần build"
        type: choice
        options: [both, android, ios]
        default: both

concurrency:
  group: shell-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read          # cổng main: đọc kết quả workflow của cùng commit trên nhánh test

env:
  CONFIG_MODE: ${{ github.ref_name == 'main' && 'production' || 'internal' }}
  # Nhánh được phát hành lên store: test → tester, main → review
  STORE_BRANCH: ${{ github.ref_name == 'main' || github.ref_name == 'test' }}

jobs:
  changes:
    name: Phát hiện thay đổi
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      ios: ${{ steps.detect.outputs.ios }}
      store: ${{ steps.detect.outputs.store }}
      shots_android: ${{ steps.detect.outputs.shots_android }}
      shots_ios: ${{ steps.detect.outputs.shots_ios }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PLATFORM: ${{ inputs.platform }}
        run: bash shell-mobile/scripts/ci-detect-changes.sh
      # main chỉ phát hành đại trà commit đã chạy thành công trên test (merge fast-forward test → main)
      - name: Cổng main – commit phải xanh trên nhánh test
        if: github.ref_name == 'main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh run list -R "$GITHUB_REPOSITORY" --workflow shell-mobile.yml --branch test --commit "$GITHUB_SHA" \
                 --status success --json databaseId --jq 'length')"
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::Commit ${GITHUB_SHA::7} chưa chạy thành công trên nhánh test – merge dev → test, chờ xanh, rồi fast-forward test → main"
            exit 1
          fi
          echo "Commit ${GITHUB_SHA::7} đã xanh trên test → cho phép phát hành"

  android:
    name: Android (APK + AAB)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shell-mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: shell-mobile/src/.node-version
          cache: npm
          cache-dependency-path: shell-mobile/src/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Giải mã 1config và chạy cp.sh (${{ env.CONFIG_MODE }})
        env:
          ONECONFIG_GPG_PASSPHRASE: ${{ secrets.ONECONFIG_GPG_PASSPHRASE }}
        run: |
          [ -n "$ONECONFIG_GPG_PASSPHRASE" ] || { echo "::error::Thiếu secret ONECONFIG_GPG_PASSPHRASE"; exit 1; }
          gpg --batch --yes --quiet --pinentry-mode loopback --decrypt \
              --passphrase "$ONECONFIG_GPG_PASSPHRASE" 1config.tar.gpg | tar -xz
          bash 1config/cp.sh "$CONFIG_MODE"

      - name: Phiên bản từ package.json (versionName + versionCode)
        run: |
          v="$(python3 -c 'import json;print(json.load(open("src/package.json"))["version"])')"
          IFS=. read -r ma mi pa <<< "$v"
          [[ "$ma$mi$pa" =~ ^[0-9]+$ ]] && [ "$mi" -lt 100 ] && [ "$pa" -lt 100 ] || { echo "::error::version \"$v\" phải dạng MAJOR.MINOR.PATCH, MINOR/PATCH < 100"; exit 1; }
          code=$(( ma*10000000 + mi*100000 + pa*1000 + GITHUB_RUN_NUMBER % 1000 ))
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"; echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Phiên bản $v, versionCode $code"

      # "Có gì mới" / "What's New" / "What to Test" của phiên bản này, từ shell-mobile/RELEASE_NOTES.md (main: bắt buộc có)
      - name: Ghi chú phát hành ${{ env.APP_VERSION }}
        run: python3 -I scripts/release-notes.py --version "$APP_VERSION" ${{ github.ref_name == 'main' && '--strict' || '' }}

      # Biến không bí mật từ 1config/android/app.env (APP_ID, PLAY_TRACK, PLAY_UPLOAD)
      - name: Đọc 1config/android/app.env
        id: cfg
        run: |
          while IFS='=' read -r k v; do
            [[ "$k" =~ ^[A-Z_]+$ ]] && echo "$(echo "$k" | tr 'A-Z' 'a-z')=$v" >> "$GITHUB_OUTPUT"
          done < <(grep -E '^[A-Z_]+=' 1config/android/app.env)
          [ -f 1config/android/play-service-account.json ] && echo "has_play=true" >> "$GITHUB_OUTPUT" || echo "has_play=false" >> "$GITHUB_OUTPUT"
          # main → production; test → PLAY_TRACK (danh sách track, vd. internal,beta). Trạng thái: draft cho tới khi app được phát hành lần đầu.
          [ "$GITHUB_REF_NAME" = main ] && echo "track=production" >> "$GITHUB_OUTPUT" || echo "track=$(sed -n 's/^PLAY_TRACK=//p' 1config/android/app.env)" >> "$GITHUB_OUTPUT"
          if [ -f 1config/android/play-service-account.json ]; then
            st="$(bash scripts/play-release-status.sh)"   # lỗi API → bước này lỗi, không upload nhầm dạng draft
            echo "release_status=$st" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: shell-mobile/src/node_modules
          key: nm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell-mobile/src/.node-version', 'shell-mobile/src/package-lock.json', 'shell-mobile/src/patches/**') }}

      - name: Cài dependency JS
        if: steps.nm.outputs.cache-hit != 'true'
        working-directory: shell-mobile/src
        run: npm ci --no-audit --no-fund

      - name: Build APK + AAB (Gradle)
        id: build
        working-directory: shell-mobile/src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab ../../dist/
          ls -la ../../dist
          echo "apk=$(cd ../../dist && ls -1 "$PWD"/*.apk | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: shell-mobile-android
          path: shell-mobile/dist/*.apk
          if-no-files-found: error
          retention-days: 7

      # ---- test: Google Play PLAY_TRACK (tester nội bộ + ngoài);  main: Google Play production (Google duyệt) --
      - name: Google Play (AAB ${{ env.APP_VERSION }} / ${{ env.VERSION_CODE }} → ${{ steps.cfg.outputs.track }}, ${{ steps.cfg.outputs.release_status }})
        if: env.STORE_BRANCH == 'true' && steps.cfg.outputs.has_play == 'true' && steps.cfg.outputs.play_upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: shell-mobile/1config/android/play-service-account.json
          packageName: ${{ steps.cfg.outputs.app_id }}
          releaseFiles: shell-mobile/dist/*.aab
          tracks: ${{ steps.cfg.outputs.track }}
          status: ${{ steps.cfg.outputs.release_status }}
          whatsNewDirectory: shell-mobile/1config/store/android/whatsnew

      - name: Google Play Internal App Sharing (link cài ngay, không cần review)
        if: github.ref_name == 'test' && steps.cfg.outputs.has_play == 'true' && steps.cfg.outputs.play_upload == 'true'
        run: bash scripts/play-internal-sharing.sh "$(ls -1 dist/*.aab | head -n1)"

      - name: Link cho tester Android (Summary)
        if: env.STORE_BRANCH == 'true' && steps.cfg.outputs.has_play == 'true' && steps.cfg.outputs.play_upload == 'true'
        run: bash scripts/play-tester-summary.sh

      - name: Dọn cấu hình đã giải mã
        if: always()
        run: |
          [ -f 1config/cp.sh ] && bash 1config/cp.sh --clean || true
          rm -rf 1config

  ios:
    name: iOS (IPA)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Xcode 26 (iOS 26 SDK) – App Store chỉ nhận bản build bằng SDK mới nhất
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        working-directory: shell-mobile
    steps:
      - uses: actions/checkout@v5

      - name: Phiên bản từ package.json
        run: echo "APP_VERSION=$(python3 -c 'import json;print(json.load(open("src/package.json"))["version"])')" >> "$GITHUB_ENV"

      # Dùng Xcode mặc định của runner: chỉ bản này có sẵn nền tảng iOS để build.
      - name: Phiên bản Xcode
        id: xcode
        run: |
          echo "version=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version-file: shell-mobile/src/.node-version
          cache: npm
          cache-dependency-path: shell-mobile/src/package-lock.json

      - name: Giải mã 1config và chạy cp.sh (${{ env.CONFIG_MODE }})
        env:
          ONECONFIG_GPG_PASSPHRASE: ${{ secrets.ONECONFIG_GPG_PASSPHRASE }}
        run: |
          [ -n "$ONECONFIG_GPG_PASSPHRASE" ] || { echo "::error::Thiếu secret ONECONFIG_GPG_PASSPHRASE"; exit 1; }
          gpg --batch --yes --quiet --pinentry-mode loopback --decrypt \
              --passphrase "$ONECONFIG_GPG_PASSPHRASE" 1config.tar.gpg | tar -xz
          bash 1config/cp.sh "$CONFIG_MODE"

      # "Có gì mới" / "What's New" / "What to Test" của phiên bản này, từ shell-mobile/RELEASE_NOTES.md (main: bắt buộc có)
      - name: Ghi chú phát hành ${{ env.APP_VERSION }}
        run: python3 -I scripts/release-notes.py --version "$APP_VERSION" ${{ github.ref_name == 'main' && '--strict' || '' }}

      # Có đủ bộ ký trong 1config (tạo bằng 1config/appconnect/asc-signing.sh) thì build bản ký App Store,
      # không thì build IPA không ký như trước.
      - name: Kiểm tra bộ ký iOS trong 1config
        id: sign
        run: |
          d=1config/ios; ok=true
          for f in AuthKey.p8 distribution.p12 signing.env profiles/omnibox-appstore.mobileprovision; do
            [ -f "$d/$f" ] || { echo "thiếu $d/$f"; ok=false; }
          done
          grep -q '^ASC_KEY_ID=<TODO' $d/app.env && { echo "ASC_KEY_ID chưa điền"; ok=false; }
          echo "signed=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = true ]; then
            P12_PASSWORD="$(sed -n 's/^P12_PASSWORD=//p' $d/signing.env)"; echo "::add-mask::$P12_PASSWORD"
            P12_B64="$(base64 < $d/distribution.p12 | tr -d '\n')"; echo "::add-mask::$P12_B64"
            { echo "p12_password=$P12_PASSWORD"; echo "p12_b64=$P12_B64"
              echo "asc_key_id=$(sed -n 's/^ASC_KEY_ID=//p' $d/app.env)"
              echo "asc_issuer_id=$(sed -n 's/^ASC_ISSUER_ID=//p' $d/app.env)"
              echo "asc_key<<ASC_KEY_EOF"; cat $d/AuthKey.p8; echo; echo "ASC_KEY_EOF"; } >> "$GITHUB_OUTPUT"
            # App record trên App Store Connect (API không tạo được – phải tạo tay) quyết định có upload TestFlight
            app_id="$(sed -n 's/^APP_ID=//p' $d/app.env)"
            n="$(bash 1config/appconnect/asc-api.sh GET "/v1/apps?filter[bundleId]=$app_id&fields[apps]=bundleId" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("data",[])))')"
            [ "$n" -gt 0 ] && echo "has_app=true" >> "$GITHUB_OUTPUT" || { echo "has_app=false" >> "$GITHUB_OUTPUT"; echo "::warning::Chưa có app record $app_id trên App Store Connect – bỏ qua upload TestFlight"; }
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            for p in $d/profiles/*.mobileprovision; do
              uuid="$(security cms -D -i "$p" | plutil -extract UUID raw -o - -)"
              cp "$p" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
              echo "đã cài profile $(basename "$p") ($uuid)"
            done
          fi

      - name: Nạp chứng chỉ Apple Distribution vào keychain
        if: steps.sign.outputs.signed == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ steps.sign.outputs.p12_b64 }}
          p12-password: ${{ steps.sign.outputs.p12_password }}

      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: shell-mobile/src/node_modules
          key: nm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell-mobile/src/.node-version', 'shell-mobile/src/package-lock.json', 'shell-mobile/src/patches/**') }}

      - name: Cache CocoaPods (Pods + bản tải về)
        uses: actions/cache@v4
        with:
          path: |
            shell-mobile/src/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('shell-mobile/src/ios/Podfile', 'shell-mobile/src/ios/Podfile.lock', 'shell-mobile/src/package-lock.json', 'shell-mobile/src/patches/**') }}

      # DerivedData: giữ phần đã biên dịch của các pod giữa các lần chạy (cùng dependency + cùng Xcode)
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: shell-mobile/src/ios/build/DerivedData
          key: dd-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('shell-mobile/src/ios/Podfile', 'shell-mobile/src/ios/Podfile.lock', 'shell-mobile/src/package-lock.json', 'shell-mobile/src/patches/**') }}

      - name: Cài dependency JS + CocoaPods
        working-directory: shell-mobile/src
        run: |
          if [ "${{ steps.nm.outputs.cache-hit }}" != "true" ]; then
            npm ci --no-audit --no-fund
          fi
          cd ios && pod install

      # Kênh Ad Hoc: profile gồm mọi iPhone đã đăng ký (1config/appconnect/asc-device.sh); chưa có máy → bỏ qua
      - name: Profile Ad Hoc
        if: steps.sign.outputs.signed == 'true' && (github.ref_name == 'dev' || github.ref_name == 'test')
        run: python3 -I scripts/ios_adhoc_profile.py

      - name: Build IPA (xcodebuild, ${{ steps.sign.outputs.signed == 'true' && 'ký App Store' || 'không ký' }})
        id: build
        env:
          SIGNED: ${{ steps.sign.outputs.signed == 'true' && '1' || '0' }}
        run: |
          OUT_DIR="$PWD/dist" bash scripts/ios-build.sh
          echo "ipa=$(ls -1 "$PWD"/dist/*.ipa | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: shell-mobile-ios
          path: |
            shell-mobile/dist/*.ipa
            shell-mobile/dist/*.manifest.plist
          if-no-files-found: error
          retention-days: 7

      # ---- test / main + đã có bộ ký: TestFlight;  main: nộp App Store Review ------------------------
      - name: Upload TestFlight (${{ env.APP_VERSION }} build ${{ env.BUILD_NUMBER }})
        if: env.STORE_BRANCH == 'true' && steps.sign.outputs.signed == 'true' && steps.sign.outputs.has_app == 'true'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.build.outputs.ipa }}
          issuer-id: ${{ steps.sign.outputs.asc_issuer_id }}
          api-key-id: ${{ steps.sign.outputs.asc_key_id }}
          api-private-key: ${{ steps.sign.outputs.asc_key }}

      - name: TestFlight cho tester ngoài (Beta App Review)
        if: github.ref_name == 'test' && steps.sign.outputs.signed == 'true' && steps.sign.outputs.has_app == 'true'
        run: python3 -I scripts/ios_testflight_external.py --version "$APP_VERSION" --build "$BUILD_NUMBER"

      - name: Dọn cấu hình đã giải mã
        if: always()
        run: |
          [ -f 1config/cp.sh ] && bash 1config/cp.sh --clean || true
          rm -rf 1config

  # Nộp App Store Review (main): tách khỏi job build iOS để nộp lại được mà không build lại – mỗi lần push main,
  # nếu phiên bản trong package.json chưa nộp/chưa phát hành thì nộp build hợp lệ mới nhất của phiên bản đó.
  ios_submit:
    name: Nộp App Store Review
    needs: [changes, ios]
    if: ${{ !cancelled() && github.ref_name == 'main' && needs.changes.result == 'success' && needs.ios.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shell-mobile
    steps:
      - uses: actions/checkout@v5
      - name: Giải mã 1config
        env:
          ONECONFIG_GPG_PASSPHRASE: ${{ secrets.ONECONFIG_GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --quiet --pinentry-mode loopback --decrypt \
              --passphrase "$ONECONFIG_GPG_PASSPHRASE" 1config.tar.gpg | tar -xz
          bash 1config/cp.sh production
      - name: Phiên bản từ package.json
        run: echo "APP_VERSION=$(python3 -c 'import json;print(json.load(open("src/package.json"))["version"])')" >> "$GITHUB_ENV"
      - name: Ghi chú phát hành ${{ env.APP_VERSION }}
        run: python3 -I scripts/release-notes.py --version "$APP_VERSION" --strict
      - name: Pillow (screenshot App Store)
        run: |
          python3 -m pip install --quiet pillow
          python3 -I -c 'import PIL; print("Pillow", PIL.__version__)'   # script chạy -I: phải thấy PIL ở site-packages chung
      - name: Nộp App Store Review ${{ env.APP_VERSION }} (build mới nhất)
        run: python3 -I scripts/ios_submit.py --version "$APP_VERSION" --build latest
      - name: Dọn cấu hình đã giải mã
        if: always()
        run: |
          [ -f 1config/cp.sh ] && bash 1config/cp.sh --clean || true
          rm -rf 1config

  store:
    name: Đồng bộ trang store
    # Chờ job Android: Google Play chỉ cho mở một edit tại một thời điểm (upload AAB cũng dùng edit)
    needs: [changes, android]
    if: ${{ !cancelled() && needs.changes.outputs.store == 'true' && needs.android.result != 'failure' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shell-mobile
    steps:
      - uses: actions/checkout@v5
      - name: Giải mã 1config (nội dung store ở 1config/store)
        env:
          ONECONFIG_GPG_PASSPHRASE: ${{ secrets.ONECONFIG_GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --quiet --pinentry-mode loopback --decrypt \
              --passphrase "$ONECONFIG_GPG_PASSPHRASE" 1config.tar.gpg | tar -xz
          bash 1config/cp.sh production
      - name: Phiên bản từ package.json
        run: echo "APP_VERSION=$(python3 -c 'import json;print(json.load(open("src/package.json"))["version"])')" >> "$GITHUB_ENV"
      - name: Ghi chú phát hành ${{ env.APP_VERSION }}
        run: python3 -I scripts/release-notes.py --version "$APP_VERSION" --strict
      - name: Pillow (chuyển WebP → PNG, chỉnh kích thước screenshot)
        run: python3 -m pip install --quiet pillow
      - name: Google Play (listing, icon, feature graphic, screenshot, liên hệ)
        env:
          SYNC_SCREENSHOTS: ${{ needs.changes.outputs.shots_android == 'true' && '1' || '0' }}
        run: bash scripts/store-sync-android.sh
      - name: App Store Connect (metadata, screenshot, xếp hạng, giá, App Review, TestFlight)
        env:
          SYNC_SCREENSHOTS: ${{ needs.changes.outputs.shots_ios == 'true' && '1' || '0' }}
        run: python3 scripts/store_sync_ios.py
      - name: Dọn cấu hình đã giải mã
        if: always()
        run: |
          [ -f 1config/cp.sh ] && bash 1config/cp.sh --clean || true
          rm -rf 1config

  publish:
    name: Đăng lên gist omnibox
    needs: [android, ios]
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: omnibox-gist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v5
        with:
          pattern: shell-mobile-*
          merge-multiple: true
          path: dist

      - name: Đăng file và kiểm tra tải về qua curl
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: bash .github/scripts/publish-to-gist.sh dist/*
